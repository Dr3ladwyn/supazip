[package]
name = "supazip-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "SupaZip archive engine: shared 7z / ZIP read and write logic for CLI and GUI front-ends."
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/supazip"
readme = "../../README.md"

[dependencies]
sevenz-rust = { version = "0.6", features = ["aes256"] }
zip = { version = "2", features = ["chrono"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "signal"] }
log = "0.4"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
