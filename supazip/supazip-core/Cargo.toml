[package]
name = "supazip-core"
version = "0.5.0"
edition = "2021"
rust-version = "1.92"
description = "SupaZip archive engine: shared 7z, ZIP, TAR, TAR.GZ and TAR.XZ read and write logic for CLI and GUI front-ends."
license = "MIT OR Apache-2.0"
authors = ["SupaZip contributors"]
repository = "https://github.com/your-org/supazip"
readme = "../../README.md"
keywords = ["archive", "7z", "zip", "tar", "compression"]
categories = ["compression", "command-line-utilities", "filesystem"]
exclude = [
    "/.github",
    "/.cursor",
    "/scripts",
    "/target",
    "/Cargo.lock.bak",
    "/.gitignore",
    "**/*.rs.bk",
]

[dependencies]
sevenz-rust = { version = "0.6", features = ["aes256"] }
# WS-B (m0.2.0): the zip crate 2.4 line ships native Zstandard compression
# behind the `zstd` feature, so we enable that. Brotli is NOT exposed by
# the zip crate, so we depend on the top-level `brotli` crate and SupaZip
# stores Brotli-compressed bytes as a Stored entry with a `.br` suffix
# (see `formats::zip`).
zip = { version = "2.4", features = ["chrono", "zstd"] }
brotli = "8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "signal"] }
log = "0.4"
tracing = "0.1"
# WS-B (m0.2.0): TAR / TAR.GZ / TAR.XZ backends. All three are pure-Rust,
# MIT / Apache-2.0 licensed. `tar` is the streaming TAR reader/writer;
# `flate2` defaults to the `miniz_oxide` Rust backend (no C dependency);
# `lzma-rs` is the pure-Rust LZMA2 / XZ codec, which the decision log
# (2026-06-06) preferred over the `xz2` C wrapper to keep the Windows /
# Linux / macOS CI matrix simple.
tar = "0.4"
flate2 = "1"
lzma-rs = "0.3"
# WS-A (m0.5.0): TOML loader for i18n string files.
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# WS-H (m0.3.0): criterion 0.5 drives the engine-level list / extract /
# create / test benches under `benches/engine.rs`. The `html_reports`
# feature enables the standalone HTML output the CI bench job uploads
# as an artefact (see `docs/benchmarks.md`).
criterion = { version = "0.5", features = ["html_reports"] }
# WS-G (m0.3.0): property-based round-trip tests for every backend.
# proptest is dev-only; no runtime cost for CLI / GUI consumers.
proptest = "1"

[[bench]]
name = "engine"
harness = false
