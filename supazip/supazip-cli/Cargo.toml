[package]
name = "supazip-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "SupaZip command-line front-end: list, extract, create and test 7z, ZIP, TAR, TAR.GZ and TAR.XZ archives."
license = "MIT OR Apache-2.0"
authors = ["SupaZip contributors"]
repository = "https://github.com/your-org/supazip"
readme = "../../README.md"
keywords = ["archive", "7z", "zip", "tar", "cli"]
categories = ["compression", "command-line-utilities", "filesystem"]
exclude = [
    "/.github",
    "/.cursor",
    "/scripts",
    "/target",
    "/Cargo.lock.bak",
    "/.gitignore",
    "**/*.rs.bk",
]

[dependencies]
supazip-core = { path = "../supazip-core", version = "1.0.0" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "signal"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
zip = { version = "2", features = ["chrono"] }

[package.metadata.deb]
maintainer = "SupaZip contributors <supazip@example.com>"
copyright = "2026, SupaZip contributors"
extended-description = "Cross-platform archive manager for 7z and ZIP"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/supazip-cli", "usr/bin/supazip", "755"],
    ["completions/supazip.bash", "usr/share/bash-completion/completions/supazip", "644"],
    ["completions/supazip.fish", "usr/share/fish/vendor_completions.d/supazip.fish", "644"],
    ["man/supazip.1", "usr/share/man/man1/supazip.1", "644"],
]

[package.metadata.rpm]
assets = [
    { src = "target/release/supazip-cli", dest = "/usr/bin/supazip", mode = "0755" },
    { src = "completions/supazip.bash", dest = "/usr/share/bash-completion/completions/supazip", mode = "0644" },
    { src = "man/supazip.1", dest = "/usr/share/man/man1/supazip.1.gz", mode = "0644" },
]
