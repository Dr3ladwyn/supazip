[package]
name = "supazip-cli"
version = "0.4.0"
edition = "2021"
rust-version = "1.92"
description = "SupaZip command-line front-end: list, extract, create and test 7z, ZIP, TAR, TAR.GZ and TAR.XZ archives."
license = "MIT OR Apache-2.0"
authors = ["SupaZip contributors"]
repository = "https://github.com/your-org/supazip"
readme = "../../README.md"
keywords = ["archive", "7z", "zip", "tar", "cli"]
categories = ["compression", "command-line-utilities", "filesystem"]
exclude = [
    "/.github",
    "/.cursor",
    "/scripts",
    "/target",
    "/Cargo.lock.bak",
    "/.gitignore",
    "**/*.rs.bk",
]

[dependencies]
supazip-core = { path = "../supazip-core", version = "0.4.0" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "signal"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
zip = { version = "2", features = ["chrono"] }
