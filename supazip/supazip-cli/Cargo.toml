[package]
name = "supazip-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
supazip-core = { path = "../supazip-core" }
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", features = ["chrono"] }
