[package]
name = "supazip-gui"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "SupaZip desktop GUI: a PeaZip-style archive manager for 7z and ZIP, built on eframe/egui."
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/supazip"
readme = "../../README.md"
# The GUI is the application front-end; only `supazip-core` and `supazip-cli`
# are published to crates.io. Keep the GUI out of the registry.
publish = false

[dependencies]
supazip-core = { path = "../supazip-core" }
eframe = "0.34"
rfd = "0.17"
log = "0.4"
tracing = "0.1"
# WS-D: recent files — JSON-persisted list under `dirs::data_local_dir()`.
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }

# Dev-deps for 0.3.0 workstreams (WS-G property tests; WS-D tests live in
# `supazip-gui` and ride on the runtime deps promoted above).
[dev-dependencies]
tempfile = "3"
zip = { version = "2", features = ["chrono"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "signal"] }
