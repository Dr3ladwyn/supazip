[package]
name = "supazip-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "SupaZip desktop GUI: a PeaZip-style archive manager for 7z and ZIP, built on eframe/egui."
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/supazip"
readme = "../../README.md"

[dependencies]
supazip-core = { path = "../supazip-core" }
eframe = "0.34"
rfd = "0.17"
log = "0.4"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
