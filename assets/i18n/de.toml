creating        = "Erstellen…"
testing         = "Prüfen…"

# Plural section. `{}` is the count placeholder; the runtime selects
# the right form per locale (en/de: one/other, ru: one/few/many).
# See assets/i18n/plural.md for the rules.
[progress.entries]
one             = "{} Eintrag"
few             = ""
many            = ""
other           = "{} Einträge"
