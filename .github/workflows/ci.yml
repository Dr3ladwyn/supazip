name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.92.0]
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup + Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.toolchain }}-
            cargo-${{ runner.os }}-

      - name: Build workspace
        working-directory: supazip
        run: cargo build --workspace --locked

      - name: Test workspace
        working-directory: supazip
        run: cargo test --workspace --locked

      - name: Clippy
        working-directory: supazip
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Format check
        working-directory: supazip
        run: cargo fmt --all -- --check

      - name: Design tokens and i18n sync check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run design sync checks
        working-directory: supazip
        run: |
          python design/scripts/check_tokens.py
          python design/scripts/check_i18n.py

  gui:
    name: GUI build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup + Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-gui-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build supazip-gui
        working-directory: supazip
        run: cargo build -p supazip-gui --locked

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # `smoke` runs two representative cargo-fuzz harnesses for 60 seconds
        # each. `none` is the explicit off-switch; useful for the initial cut
        # of 0.2.0 when nightly / cargo-fuzz is not yet available on the
        # runner. The job is `continue-on-error: true` either way: it is a
        # regression alarm, not a hard gate, in 0.2.0.
        strategy: [smoke, none]
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup + Rust nightly
        if: matrix.strategy == 'smoke'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Cache cargo
        if: matrix.strategy == 'smoke'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fuzz-${{ runner.os }}-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-fuzz-${{ runner.os }}-nightly-
            cargo-fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        if: matrix.strategy == 'smoke'
        run: cargo install cargo-fuzz

      - name: Fuzz zip_list (60s)
        if: matrix.strategy == 'smoke'
        working-directory: supazip/supazip-core
        run: cargo +nightly fuzz run zip_list -- -max_total_time=60

      - name: Fuzz sevenz_extract (60s)
        if: matrix.strategy == 'smoke'
        working-directory: supazip/supazip-core
        run: cargo +nightly fuzz run sevenz_extract -- -max_total_time=60

      - name: Skip
        if: matrix.strategy == 'none'
        run: |
          echo "fuzz smoke disabled for this run (matrix.strategy=none) — set matrix.strategy=smoke to enable the 60s cargo-fuzz smoke."
          echo "see supazip-core/fuzz/README.md for the manual runbook."
