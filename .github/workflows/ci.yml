name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core-cli:
    name: core + cli (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        rust: [stable, 1.92.0]
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup + Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: supazip -> target

      - name: cargo fmt
        working-directory: supazip
        run: cargo fmt --all -- --check

      - name: cargo build (core + cli)
        working-directory: supazip
        run: cargo build -p supazip-core -p supazip-cli --locked

      - name: cargo test (core + cli)
        working-directory: supazip
        run: cargo test -p supazip-core -p supazip-cli --locked

      - name: cargo clippy
        working-directory: supazip
        run: cargo clippy -p supazip-core -p supazip-cli --no-deps -- -D warnings --locked

      - name: cargo doc
        working-directory: supazip
        run: cargo doc -p supazip-core -p supazip-cli --no-deps --locked

      - name: Design tokens and i18n sync check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run design sync checks
        working-directory: supazip
        run: |
          python design/scripts/check_tokens.py
          python design/scripts/check_i18n.py

  gui:
    name: gui (windows only, rustc 1.92.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup + Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: supazip -> target

      - name: cargo build (gui)
        working-directory: supazip
        run: cargo build -p supazip-gui --locked

      - name: cargo test (gui)
        working-directory: supazip
        run: cargo test -p supazip-gui --locked

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # `smoke` runs two representative cargo-fuzz harnesses for 60 seconds
        # each. `none` is the explicit off-switch; useful for the initial cut
        # of 0.2.0 when nightly / cargo-fuzz is not yet available on the
        # runner. The job is `continue-on-error: true` either way: it is a
        # regression alarm, not a hard gate, in 0.2.0.
        strategy: [smoke, none]
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup + Rust nightly
        if: matrix.strategy == 'smoke'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Cache cargo
        if: matrix.strategy == 'smoke'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fuzz-${{ runner.os }}-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-fuzz-${{ runner.os }}-nightly-
            cargo-fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        if: matrix.strategy == 'smoke'
        run: cargo install cargo-fuzz

      - name: Fuzz zip_list (60s)
        if: matrix.strategy == 'smoke'
        working-directory: supazip/supazip-core
        run: cargo +nightly fuzz run zip_list -- -max_total_time=60

      - name: Fuzz sevenz_extract (60s)
        if: matrix.strategy == 'smoke'
        working-directory: supazip/supazip-core
        run: cargo +nightly fuzz run sevenz_extract -- -max_total_time=60

      - name: Skip
        if: matrix.strategy == 'none'
        run: |
          echo "fuzz smoke disabled for this run (matrix.strategy=none) — set matrix.strategy=smoke to enable the 60s cargo-fuzz smoke."
          echo "see supazip-core/fuzz/README.md for the manual runbook."
