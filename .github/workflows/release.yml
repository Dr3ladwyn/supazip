name: release

# Tag-triggered release workflow (skeleton for 0.2.0).
#
# This workflow is intentionally NOT triggered in 0.2.0 — the milestone
# ships a crates.io publish (dry-run) only, and the GitHub release draft is
# generated by hand. It exists so that the first `v0.2.0+` tag push
# (handled by a separate workstream, post-WS-F) already has a working
# pipeline: CLI build on Windows / Ubuntu / macOS, package the binary,
# publish a draft release through `softprops/action-gh-release`.
#
# 0.2.0 decisions baked in:
#   * Only the CLI is built. The GUI requires a system webview and is
#     not packaged here; GUI distribution lives in the 0.5.0 track.
#   * `draft: true` so the maintainer reviews the release notes before
#     the public GitHub Release is published.
#   * `generate_release_notes: true` so the body is auto-populated from
#     merged PRs / labels; the maintainer edits it before publishing.
#   * macOS is in the matrix even though core CI is win+ubuntu only
#     (decision 2026-06-06); release artifacts are a separate concern
#     and benefit from the third platform.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup + Rust 1.92.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: supazip -> target

      - name: Build (cli only, release)
        working-directory: supazip
        run: cargo build -p supazip-cli --release --locked

      - name: Package binary
        shell: bash
        run: |
          mkdir -p artifacts
          # Windows produces supazip-cli.exe; Linux/macOS produce supazip-cli.
          cp target/release/supazip-cli* artifacts/ || true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
