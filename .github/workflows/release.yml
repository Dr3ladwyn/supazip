name: release

# Tag-triggered release workflow (WS-H of milestone 1.0-rc.1).
#
# Pipeline:
#   1. `build` (matrix): compile `supazip-cli` for 5 targets:
#      - x86_64-pc-windows-msvc
#      - x86_64-unknown-linux-gnu
#      - x86_64-apple-darwin
#      - aarch64-apple-darwin
#      - aarch64-unknown-linux-gnu  (cross-compiled on ubuntu-latest)
#      Uploads each binary as a workflow artifact.
#   2. `sign`: downloads all binaries, computes SHA-256SUMS, signs the
#      checksum file with `minisign` (key from `secrets.MINISIGN_SECRET_KEY`),
#      generates a CycloneDX SBOM from `Cargo.lock`, and publishes
#      everything as a draft GitHub Release.
#
# History:
#   * 0.3.0 (WS-I): initial pipeline — 4 targets, SHA-256 + minisign
#     signature, draft release.
#   * 1.0-rc.1 (WS-H): added `aarch64-unknown-linux-gnu` (5th target),
#     fixed SBOM to write to `dist/` via `output-file`, updated header.
#
# Design decisions:
#   * Only the CLI is built. The GUI requires a system webview and is
#     not packaged here; GUI distribution lives in the 0.5.0 track.
#   * `minisign` is the signing tool (ISC, single-binary, the standard
#     for archive releases).
#   * `draft: true` so the maintainer reviews the release notes and the
#     SHA-256 / signature pair before the public GitHub Release is
#     published.
#   * `generate_release_notes: true` so the body is auto-populated from
#     merged PRs / labels; the maintainer edits it before publishing.
#   * The public minisign key ships at `assets/minisign.pub` and is
#     surfaced through `docs/release-process.md` and the README.
#   * CycloneDX SBOM is generated from the workspace `Cargo.lock` for
#     reproducibility; attached to the release as `supazip-cli.spdx.json`.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    name: Build binaries (${{ matrix.os }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
        exclude:
          - os: windows-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: supazip -> target
          cache-on-failure: true

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        working-directory: supazip
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build -p supazip-cli --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        working-directory: supazip
        run: |
          mkdir -p artifacts
          BIN="target/${{ matrix.target }}/release/supazip-cli${{ matrix.ext }}"
          [ -f "$BIN" ] && cp "$BIN" "artifacts/supazip-cli-${{ matrix.target }}${{ matrix.ext }}"

      - name: macOS sign + notarize
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        working-directory: supazip
        run: |
          echo "$APPLE_CERTIFICATE" | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          CERT_NAME=$(security find-identity -v build.keychain | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)"/\1/')
          codesign --deep --force --options runtime --sign "$CERT_NAME" "artifacts/supazip-cli-${{ matrix.target }}"
          xcrun notarytool submit "artifacts/supazip-cli-${{ matrix.target }}" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "artifacts/supazip-cli-${{ matrix.target }}"
          rm -f cert.p12 build.keychain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: supazip/artifacts/*

  sign:
    name: Sign and publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Install minisign
        run: sudo apt-get install -y minisign

      - name: Compute SHA-256
        shell: bash
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS

      - name: Sign with minisign
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$MINISIGN_SECRET_KEY" > minisign.key
          chmod 600 minisign.key
          echo "$MINISIGN_PASSPHRASE" | minisign -S \
            -s minisign.key \
            -m SHA256SUMS \
            -c "SupaZip release ${{ github.ref_name }}"
          rm -f minisign.key

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: supazip/
          format: cyclonedx-json
          output-file: dist/supazip-cli.spdx.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/*.exe
            dist/supazip-cli-*
            dist/*.spdx.json
