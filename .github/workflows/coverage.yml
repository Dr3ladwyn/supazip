name: coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: supazip -> target
      - name: Run coverage
        working-directory: supazip
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: supazip/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check threshold (80%)
        working-directory: supazip
        run: |
          COV=$(cargo llvm-cov report --summary-only | awk '$1 == "TOTAL" { gsub(/%/, "", $10); print $10 }')
          if [ -z "$COV" ]; then
            echo "::error::Could not parse line coverage from cargo-llvm-cov summary"
            exit 1
          fi
          echo "Coverage: $COV%"
          if ! awk -v coverage="$COV" 'BEGIN { exit !(coverage >= 80) }'; then
            echo "::error::Coverage $COV% is below 80% threshold"
            exit 1
          fi
