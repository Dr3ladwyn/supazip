name: Milestone task
description: Track a piece of work against a SupaZip release milestone. See `ROADMAP.md` for the full plan.
title: "[${{ inputs.milestone }}/${{ inputs.track }}] <short description>"
labels:
  - milestone-task
assignees: []
body:
  - type: input
    id: summary
    attributes:
      label: "Summary"
      description: "One-sentence goal of this task. No punctuation at the end."
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: "Milestone"
      description: "Target release. See `ROADMAP.md` for criteria."
      options:
        - "0.2.0 — Engine solid"
        - "0.3.0 — GUI feature-complete"
        - "0.4.0 — QA + Security hardening"
        - "0.5.0 — i18n + a11y + docs"
        - "1.0-rc.1 — Distribution"
        - "1.0.0 — Production"
    validations:
      required: true

  - type: dropdown
    id: track
    attributes:
      label: "Track"
      description: "Which roadmap track this task belongs to."
      options:
        - "A — Engine / core features"
        - "B — GUI features"
        - "C — QA + Security"
        - "D — i18n + a11y + docs"
        - "E — Distribution / Packaging"
        - "CLI — separate stream"
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: "Effort"
      description: "Rough size of the change."
      options:
        - "S (< 1 day)"
        - "M (1-3 days)"
        - "L (3-7 days)"
        - "XL (> 1 week)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Codebase area."
      options:
        - "supazip-core"
        - "supazip-cli"
        - "supazip-gui"
        - "supazip-core/fuzz"
        - "CI / GitHub Actions"
        - "Design system / assets"
        - "Documentation"
        - "Distribution / Packaging"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "Background, links to prior issues/PRs, related `ROADMAP.md` section."
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: "Proposal"
      description: "Concrete plan. List files to touch. Call out new dependencies and licenses."
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: "Testing plan"
      description: "How will this be verified? Unit tests, integration tests, manual GUI steps, fuzz harness, etc."
    validations:
      required: true

  - type: textarea
    id: ready_when
    attributes:
      label: "Ready when (checklist)"
      description: "Markdown checklist the issue will be checked against before closing."
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-submit checks"
      options:
        - label: "`ROADMAP.md` lists this work under the chosen milestone"
        - label: "No new top-level dependency without a license compatible with MIT/Apache-2.0"
        - label: "Discussion issue or design note linked from `Context`"
        - label: "Test plan reviewed by at least one maintainer"
